<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="gold" x1="8" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0d060"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#c8960a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="#080807"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#2a2624" stroke-width="1"/>
  <text
    x="16"
    y="22.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="800"
    fill="url(#gold)"
    filter="url(#glow)"
  >B</text>
</svg>
